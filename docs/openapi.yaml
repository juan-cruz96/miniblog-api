openapi: 3.0.3

info:
  title: MiniBlog API
  version: 1.0.0
  description: API REST para gestionar autores y publicaciones.

servers:
  - url: /
    description: Servidor donde está ejecutándose la API

tags:
  - name: Authors
    description: Gestión de autores
  - name: Posts
    description: Gestión de publicaciones

paths:
  /authors:
    get:
      tags: [Authors]
      summary: Listar todos los autores
      responses:
        "200":
          description: Lista de autores. Puede estar vacía.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Author"
        "500":
          $ref: "#/components/responses/InternalError"

    post:
      tags: [Authors]
      summary: Crear un autor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthorInput"
      responses:
        "201":
          description: Autor creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Author"
        "400":
          description: Datos inválidos o email ya registrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /authors/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
          maximum: 2147483647

    get:
      tags: [Authors]
      summary: Obtener un autor por ID
      responses:
        "200":
          description: Autor encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Author"
        "400":
          description: ID inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Autor no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

    put:
      tags: [Authors]
      summary: Actualizar un autor
      description: Requiere nombre y email. Si se omite bio, se guarda null.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthorInput"
      responses:
        "200":
          description: Autor actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Author"
        "400":
          description: ID o datos inválidos, o email ya registrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Autor no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

    delete:
      tags: [Authors]
      summary: Eliminar un autor
      description: Solo se pueden eliminar autores sin posts asociados.
      responses:
        "200":
          description: Autor eliminado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
              example:
                message: Autor eliminado con éxito
        "400":
          description: ID inválido o autor con posts asociados
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Autor no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /posts:
    get:
      tags: [Posts]
      summary: Listar todos los posts
      description: Incluye publicaciones con published en true y en false.
      responses:
        "200":
          description: Lista de posts. Puede estar vacía.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Post"
        "500":
          $ref: "#/components/responses/InternalError"

    post:
      tags: [Posts]
      summary: Crear un post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostInput"
      responses:
        "201":
          description: Post creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "400":
          description: Datos inválidos o autor inexistente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /posts/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
          maximum: 2147483647

    get:
      tags: [Posts]
      summary: Obtener un post por ID
      responses:
        "200":
          description: Post encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "400":
          description: ID inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Post no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

    put:
      tags: [Posts]
      summary: Actualizar un post
      description: >
        Requiere author_id, title y content.
        Si se omite published, se guarda false.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostInput"
      responses:
        "200":
          description: Post actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "400":
          description: ID o datos inválidos, o autor inexistente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Post no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

    delete:
      tags: [Posts]
      summary: Eliminar un post
      responses:
        "200":
          description: Post eliminado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
              example:
                message: Post eliminado con éxito
        "400":
          description: ID inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Post no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /posts/author/{authorId}:
    parameters:
      - name: authorId
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
          maximum: 2147483647

    get:
      tags: [Posts]
      summary: Obtener los posts de un autor con sus datos
      description: >
        Cada post incluye author_name, author_email y author_bio.
        Si el autor existe pero no tiene posts, devuelve un array vacío.
      responses:
        "200":
          description: Lista de posts con datos del autor
          content:
            application/json:
              schema:
                type: array
                items:
                  allOf:
                    - $ref: "#/components/schemas/Post"
                    - type: object
                      required: [author_name, author_email, author_bio]
                      properties:
                        author_name:
                          type: string
                          example: Lucía Fernández
                        author_email:
                          type: string
                          example: lucia.fernandez@example.com
                        author_bio:
                          type: string
                          nullable: true
                          example: Periodista y viajera.
        "400":
          description: ID del autor inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Autor no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  schemas:
    AuthorInput:
      type: object
      required: [name, email]
      properties:
        name:
          type: string
          minLength: 1
          description: No puede estar vacío ni contener solo espacios.
          example: Lucía Fernández
        email:
          type: string
          minLength: 1
          description: Debe ser único y no puede contener solo espacios.
          example: lucia.fernandez@example.com
        bio:
          type: string
          nullable: true
          default: null
          example: Periodista y viajera.

    Author:
      allOf:
        - $ref: "#/components/schemas/AuthorInput"
        - type: object
          required: [id, bio, created_at]
          properties:
            id:
              type: integer
              example: 6
            created_at:
              type: string
              format: date-time
              example: "2026-11-02T20:29:28.120Z"

    PostInput:
      type: object
      required: [author_id, title, content]
      properties:
        author_id:
          type: integer
          minimum: 1
          maximum: 2147483647
          description: ID de un autor existente.
          example: 6
        title:
          type: string
          minLength: 1
          description: No puede estar vacío ni contener solo espacios.
          example: Un fin de semana en el Delta de Tigre
        content:
          type: string
          minLength: 1
          description: No puede estar vacío ni contener solo espacios.
          example: Pasamos el fin de semana en una cabaña sobre el río.
        published:
          type: boolean
          default: false
          example: true

    Post:
      allOf:
        - $ref: "#/components/schemas/PostInput"
        - type: object
          required: [id, published, created_at]
          properties:
            id:
              type: integer
              example: 5
            created_at:
              type: string
              format: date-time
              example: "2026-11-02T20:32:35.796Z"

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          example: Autor no encontrado

    Message:
      type: object
      required: [message]
      properties:
        message:
          type: string
          example: Autor eliminado con éxito

  responses:
    InternalError:
      description: Error interno del servidor
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"